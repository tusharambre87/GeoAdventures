kind = "mobile"
previewPath = "/roamus-mobile/"
title = "RoamUs"
version = "1.0.0"
id = "artifacts/roamus-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/roamus-mobile/" ]
localPort = 5173

[services.development]
run = "cd /home/runner/workspace/artifacts/roamus-mobile && EXPO_PACKAGER_PROXY_URL=https://$REPLIT_EXPO_DEV_DOMAIN EXPO_PUBLIC_DOMAIN=$REPLIT_DEV_DOMAIN EXPO_PUBLIC_REPL_ID=$REPL_ID REACT_NATIVE_PACKAGER_HOSTNAME=$REPLIT_DEV_DOMAIN pnpm exec expo start --port 5173 --clear"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roamus-mobile", "run", "build" ]
run = [ "sh", "artifacts/roamus-mobile/start.sh" ]

[services.env]
PORT = "5173"
BASE_PATH = "/roamus-mobile/"
